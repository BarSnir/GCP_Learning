apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: echo
  namespace: mesh-demo
spec:
  host: echo
  subsets:
    - name: v1
      labels:
        version: v1
    - name: v2
      labels:
        version: v2
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: echo
  namespace: mesh-demo
spec:
  hosts:
    - echo
  http:
    - route:
        - destination:
            host: echo
            subset: v1
          weight: 50
        - destination:
            host: echo
            subset: v2
          weight: 50
