apiVersion: v1
kind: ServiceAccount
metadata:
  name: caller-sa
  namespace: mesh-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: caller
  namespace: mesh-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: caller
  template:
    metadata:
      labels:
        app: caller
    spec:
      serviceAccountName: caller-sa
      containers:
        - name: caller
          image: curlimages/curl:8.11.1
          command:
            - sh
            - -c
            - sleep infinity
