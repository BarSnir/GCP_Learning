apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: storage-demo

spec:
  serviceName: storage-demo
  replicas: 1

  selector:
    matchLabels:
      app: storage-demo

  template:
    metadata:
      labels:
        app: storage-demo

    spec:
      containers:
        - name: app
          image: busybox:1.37

          command:
            - /bin/sh
            - -c
            - |
              while true; do
                sleep 3600
              done

          volumeMounts:
            - name: data
              mountPath: /data

          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"

            limits:
              cpu: "20m"
              memory: "32Mi"

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: app-data
