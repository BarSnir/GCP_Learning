apiVersion: apps/v1
kind: Deployment
metadata:
  name: pdb-demo

spec:
  replicas: 2

  selector:
    matchLabels:
      app: pdb-demo

  template:
    metadata:
      labels:
        app: pdb-demo

    spec:
      containers:
        - name: nginx
          image: nginx:alpine

          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"

            limits:
              cpu: "20m"
              memory: "32Mi"

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pdb-demo

spec:
  minAvailable: 1

  selector:
    matchLabels:
      app: pdb-demo
