apiVersion: apps/v1
kind: Deployment
metadata:
  name: mode-demo
spec:
  replicas: 1

  selector:
    matchLabels:
      app: mode-demo

  template:
    metadata:
      labels:
        app: mode-demo

    spec:
      containers:
        - name: nginx
          image: nginx:alpine

          ports:
            - containerPort: 80

          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"

            limits:
              cpu: "100m"
              memory: "64Mi"