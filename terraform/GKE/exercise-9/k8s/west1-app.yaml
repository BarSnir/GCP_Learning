apiVersion: apps/v1
kind: Deployment
metadata:
  name: multi-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: multi-demo
  template:
    metadata:
      labels:
        app: multi-demo
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          command:
            - /bin/sh
            - -c
            - |
              echo '<h1>Hello from europe-west1</h1>' > /usr/share/nginx/html/index.html
              nginx -g 'daemon off;'
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "30m"
              memory: "32Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: multi-demo
spec:
  selector:
    app: multi-demo
  ports:
    - port: 80
      targetPort: 80
