apiVersion: v1
kind: Service
metadata:
  name: team-a
spec:
  type: ClusterIP
  selector:
    app: team-a
  ports:
    - port: 80
      targetPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: team-b
spec:
  type: ClusterIP
  selector:
    app: team-b
  ports:
    - port: 80
      targetPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: team-a-nodeport
spec:
  type: NodePort
  selector:
    app: team-a
  ports:
    - port: 80
      targetPort: 80
