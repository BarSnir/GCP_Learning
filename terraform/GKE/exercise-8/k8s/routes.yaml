apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: shared-routes
spec:
  parentRefs:
    - name: shared-gateway

  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /team-a
      backendRefs:
        - name: team-a
          port: 80

    - matches:
        - path:
            type: PathPrefix
            value: /team-b
      backendRefs:
        - name: team-b
          port: 80
