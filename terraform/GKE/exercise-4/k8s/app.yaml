apiVersion: apps/v1
kind: Deployment
metadata:
  name: dedicated-app

spec:
  replicas: 1

  selector:
    matchLabels:
      app: dedicated-app

  template:
    metadata:
      labels:
        app: dedicated-app

    spec:
      nodeSelector:
        pool: apps

      tolerations:
        - key: dedicated
          operator: Equal
          value: apps
          effect: NoSchedule

      containers:
        - name: nginx
          image: nginx:alpine

          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"

            limits:
              cpu: "200m"
              memory: "128Mi"