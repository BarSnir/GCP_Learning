apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: nginx-deployment

  template:
    metadata:
      labels:
        app: nginx-deployment

    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine

          resources:
            requests:
              cpu: "20m"
              memory: "32Mi"

            limits:
              cpu: "50m"
              memory: "64Mi"