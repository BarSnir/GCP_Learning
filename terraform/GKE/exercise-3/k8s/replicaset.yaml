apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: nginx-rs

spec:
  replicas: 2

  selector:
    matchLabels:
      app: nginx-rs

  template:
    metadata:
      labels:
        app: nginx-rs

    spec:
      containers:
        - name: nginx
          image: nginx:alpine

          resources:
            requests:
              cpu: "20m"
              memory: "32Mi"

            limits:
              cpu: "50m"
              memory: "64Mi"