apiVersion: v1
kind: Service
metadata:
  name: nginx-stateful
spec:
  clusterIP: None

  selector:
    app: nginx-stateful

  ports:
    - port: 80

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nginx-stateful
spec:
  serviceName: nginx-stateful
  replicas: 2

  selector:
    matchLabels:
      app: nginx-stateful

  template:
    metadata:
      labels:
        app: nginx-stateful

    spec:
      containers:
        - name: nginx
          image: nginx:alpine

          resources:
            requests:
              cpu: "20m"
              memory: "32Mi"

            limits:
              cpu: "50m"
              memory: "64Mi"
              